name: Module builder
on:
  issues:
    types: [opened, labeled]
concurrency:
  group: module-builder
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  triage:
    if: github.event.action == 'opened' && (startsWith(github.event.issue.title, '[Control request]') || startsWith(github.event.issue.title, '[Module update]'))
    runs-on: ubuntu-latest
    steps:
      - name: Label the request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event.issue.title }}" == "[Module update]"* ]]; then LABEL=module-update; else LABEL=module-request; fi
          gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label "$LABEL"
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "Request received. It is waiting for owner approval in Control → Modules → Admin."
  build:
    if: contains(github.event.issue.labels.*.name, 'module-approved')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build module from request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEYS: ${{ secrets.OPENAI_API_KEYS }}
          MODULE_AI_MODELS: ${{ vars.MODULE_AI_MODELS }}
          XAI_API_KEYS: ${{ secrets.XAI_API_KEYS }}
          PERPLEXITY_API_KEYS: ${{ secrets.PERPLEXITY_API_KEYS }}
          ANTHROPIC_API_KEYS: ${{ secrets.ANTHROPIC_API_KEYS }}
          AIKEYS_URL: https://relay.eyeknow.app
          AIKEYS_BUILDER_SECRET: ${{ secrets.AIKEYS_BUILDER_SECRET }}
        run: python3 modules/builder/build-module.py
      - name: Commit module
        run: |
          git config user.name "control-module-builder"
          git config user.email "actions@github.com"
          git add modules
          git diff --cached --quiet && exit 0
          git commit -m "Build module from issue #${{ github.event.issue.number }}"
          for i in 1 2 3; do
            git push && break
            git pull --rebase origin main
          done
      - name: Comment result
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} --body "Module built and published to modules/. Open Control → Modules → Check for modules."
